# Local full stack: docker compose up --build   (then open http://localhost:8080)
services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_ENV: production
      JWT_SECRET: local-dev-secret-change-me
      MONGODB_URI: mongodb://mongo:27017/roamio
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on: [mongo]
volumes:
  mongo-data:
